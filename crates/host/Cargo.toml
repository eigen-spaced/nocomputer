[package]
name = "nocomputer-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "nocomputer host process: serves paired viewers, fed by the capture app over a local pipe"

[dependencies]
nocomputer-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
